name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The pinned sources are ~46 MB and change only when sources.ts does,
      # so this keeps the download off every deploy.
      - name: Cache the downloaded sources
        uses: actions/cache@v4
        with:
          path: data
          key: sources-${{ hashFiles('packages/pipeline/src/sources.ts') }}

      - run: pnpm fetch:sources
      - run: pnpm build
      # prebuild (scripts/stage-data.mjs) stages every artifact the pipeline
      # emits from the just-built dist/ into public-data/, which is what
      # Vite's publicDir actually points at -- not dist/ itself, so the build
      # never depends on dist/'s own file layout. All eight are staged and
      # shipped, not a curated subset: the progressive-upgrade chain fetches
      # every version level and both land levels at runtime, not just the
      # coarse pair. Uncompressed on disk that is changes.json 0.6 MB,
      # land.0 0.07 MB, land.1 0.95 MB, polities 0.25 MB, versions.0 35.6 MB,
      # versions.1 47.2 MB, versions.2 77.0 MB, manifest 0.002 MB -- 154 MB
      # total, comfortably inside GitHub Pages' limits (the largest single
      # file, versions.2 at 77.0 MB, is under its 100 MB per-file cap).
      # Building right after `pnpm build` means the staged data and the app
      # ship from one commit.
      - run: pnpm --filter @history/viewer build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/viewer/dist-app
      - id: deployment
        uses: actions/deploy-pages@v4
