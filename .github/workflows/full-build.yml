name: Full build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:sources
      - run: pnpm build
      - name: Report artifact sizes and enforce the 8 MB coarse budget
        run: |
          node -e "
            const m = require('./dist/manifest.json');
            for (const a of m.artifacts) {
              console.log(a.file, a.bytes, 'bytes,', a.gzipBytes, 'gzipped');
            }
            const budget = 8 * 1024 * 1024;
            const coarse = m.artifacts.find((a) => a.file === 'versions.0.json');
            if (!coarse) {
              console.error('versions.0.json is missing from manifest.artifacts');
              process.exit(1);
            }
            if (coarse.gzipBytes >= budget) {
              console.error(
                'versions.0.json is ' + coarse.gzipBytes + ' bytes gzipped, at or over the ' +
                  budget + ' byte budget',
              );
              process.exit(1);
            }
          "
      - name: Every year renders something (acceptance criterion 14)
        run: |
          node -e "
            const rows = require('./dist/versions.0.json').rows;
            const FADE = 0.4 * 4;
            const lo = Math.min(...rows.map((r) => r.fromYear));
            const hi = Math.max(...rows.map((r) => r.toYear));
            const empty = [];
            for (let y = lo; y <= hi; y++) {
              const t = y + 0.5;
              let live = false;
              for (const r of rows) {
                const fade = Math.min(FADE, (r.toYear - r.fromYear + 1) / 2);
                if (t >= r.fromYear && t < r.toYear + 1 + fade) { live = true; break; }
              }
              if (!live) empty.push(y);
            }
            if (empty.length) {
              console.error('years with nothing on screen:', empty.length, empty.slice(0, 20));
              process.exit(1);
            }
            console.log('every year from ' + lo + ' to ' + hi + ' renders at least one version');
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
