<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playback spike</title>
<style>
  /* Warm retro chrome around a deep map plate. The paper is where your hands
     are: controls, names, the year. The plate is the only place with saturation
     and the only place light means anything. */
  :root {
    --paper: #E9E2D4;
    --paper-2: #E1D8C6;
    --rule: #CFC3AC;
    --ink: #2E2A24;
    --ink-soft: #6D6355;
    --clay: #B5603F;
    --plate: #141F29;
    --sans: ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: var(--paper); color: var(--ink);
    font: 400 13px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  body { display: grid; grid-template-columns: 1fr 208px; grid-template-rows: 1fr auto; }

  main { position: relative; padding: 16px 8px 8px 16px; min-height: 0; }

  /* The plate: a lit surface inset into a printed page. */
  #map {
    width: 100%; height: 100%; display: block;
    background: var(--plate);
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18), 0 1px 2px rgba(60,48,32,0.16);
  }

  #tip {
    position: absolute; left: 26px; bottom: 18px;
    background: rgba(20,31,41,0.9); color: #E4DED2;
    font: 400 12px/1 var(--sans); letter-spacing: 0.01em;
    padding: 7px 10px; border-radius: 3px;
    opacity: 0; transition: opacity 120ms ease; pointer-events: none;
  }

  aside { padding: 18px 18px 8px 10px; overflow-y: auto; min-height: 0; }
  aside h2 {
    margin: 0 0 3px; font: 500 11px/1.4 var(--sans);
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-soft);
  }
  #slice, #coastnote { color: var(--ink-soft); font-size: 11px; margin-bottom: 14px; }

  #legend { list-style: none; margin: 0; padding: 0; font: 400 13px/1.5 var(--serif); }
  #legend li { padding: 3px 0; border-bottom: 1px solid rgba(120,104,84,0.14); display: flex; align-items: baseline; gap: 7px; }

  .mark { width: 5px; height: 5px; border-radius: 50%; flex: none; background: transparent; }
  .mark.grow { background: var(--clay); }
  .mark.shrink { background: rgba(120,104,84,0.4); }

  footer {
    grid-column: 1 / -1;
    border-top: 1px solid var(--rule);
    display: flex; align-items: center; gap: 24px;
    padding: 12px 18px 14px; flex-wrap: wrap;
  }

  /* The year is the number you watch for twenty minutes. Serif, because it is
     the voice of the thing rather than part of the instrument. Tabular lining
     figures so the digits do not shuffle during playback. */
  #year {
    font: 400 34px/1 var(--serif);
    font-variant-numeric: lining-nums tabular-nums;
    letter-spacing: -0.005em; min-width: 168px;
  }

  .scrubwrap { flex: 1 1 300px; min-width: 220px; }
  #ticks { display: block; width: 100%; height: 8px; }
  input[type="range"] { width: 100%; accent-color: var(--clay); margin: 2px 0 0; }

  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.02em; }
  .field input[type="range"] { width: 132px; }

  button {
    background: transparent; color: var(--ink);
    border: 1px solid var(--rule); border-radius: 3px;
    padding: 6px 14px; font: 400 13px var(--sans); cursor: pointer; min-width: 74px;
  }
  button:hover { border-color: var(--clay); color: var(--clay); }
  :focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }

  .stats { color: var(--ink-soft); font-size: 11px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<main>
  <canvas id="map"></canvas>
  <div id="tip"></div>
</main>

<aside>
  <h2>On screen</h2>
  <div id="slice">Loading…</div>
  <ul id="legend"></ul>
  <div id="coastnote"></div>
</aside>

<footer>
  <div id="year">—</div>
  <button id="play">Play</button>

  <div class="scrubwrap">
    <canvas id="ticks" title="Every year in which something starts or ends"></canvas>
    <input type="range" id="scrub" min="-200" max="500" step="0.5" value="-200" aria-label="Year">
  </div>

  <div class="field">
    <label for="speed">Speed <span id="speedValue"></span></label>
    <input type="range" id="speed" min="0" max="1" step="0.001" value="0.26">
  </div>

  <div class="stats"><span id="onscreen">0</span> on screen · <span id="fade">—</span></div>
</footer>

<script type="module" src="src/app.mjs"></script>
</body>
</html>
